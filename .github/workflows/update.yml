name: 更新配置

on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小时一次
  workflow_dispatch:          # 支持在 Actions 页面手动运行
  push:
    paths:
      - "sources.json"
      - "custom.json"
      - "scripts/**"
      - "cat-lite.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安卓 TVBox 配置（饭太硬）
        run: python scripts/build.py
        continue-on-error: true
      - name: MiraPlay 源（去掉 4K）
        run: python scripts/cat_lite.py
      - name: 有变化就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "更新配置 $(date -u +%F' '%H:%M)"
          git push
